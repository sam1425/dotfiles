# --- Bindings ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse support
set -g mouse on

# New tab (window)
bind -n C-t new-window

# Close tab (window)
bind -n C-w kill-window

# Next tab
bind -n C-Tab next-window

# Previous tab
bind -n S-C-Tab previous-window

# Direct tab access
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# --- Settings ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-interval 5

# --- Floating Kitty-style Tabs (Transparent Bar) ---
# Original Gruvbox Colors (Dark 256)
# bg0: colour235
# bg1: colour237
# fg1: colour223
# gray: colour245
# yellow: colour214

set -g status "on"
set -g status-justify "left"
set -g status-left ""
set -g status-right ""

# Set the status bar background to default (transparent)
set -g status-style "bg=default"

# Inactive tab (window) - No background, just gray text
setw -g window-status-format "#[fg=colour245,bg=default]  #I:#W  "

# Active tab (window) - Highlighted with Gruvbox Yellow background
setw -g window-status-current-format "#[bg=colour214,fg=colour235,bold]  #I:#W  "

# Spacing between tabs
setw -g window-status-separator " "

# Pane border (minimal)
set -g pane-active-border-style "fg=colour237"
set -g pane-border-style "fg=colour235"

# Message styling
set -g message-style "bg=colour237,fg=colour223"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
